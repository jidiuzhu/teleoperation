name: kinect
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - numpy>=1.26,<2
  - opencv=4.10
  - open3d=0.18
  - paramiko=3.5
  - pillow
  - pip=24.2
  - setuptools<81
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.7.1+cu126
      - torchvision==0.22.1+cu126
      - pykinect-azure==0.0.4
      - einops
      - timm>=1.0.17
      - tqdm
      - ftfy==6.1.1
      - regex
      - iopath>=0.1.10
      - typing_extensions
      - huggingface_hub
      - pycocotools
      - psutil
      - -e ../sam3
