[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundationpose-kinect"
version = "0.1.0"
description = "Reusable Azure Kinect and FoundationPose C++ integration API"
readme = "MODULE_GUIDE_CN.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fp-kinect = "foundationpose_kinect.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

